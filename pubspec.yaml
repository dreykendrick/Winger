name: winger
description: "Winger Social Commerce Marketplace Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking & Backend Integration
  dio: ^5.5.0+1
  supabase_flutter: ^2.6.0
  connectivity_plus: ^6.0.3

  # Environment & Utilities
  flutter_dotenv: ^5.1.0
  logger: ^2.3.0
  uuid: ^4.4.0

  # Immutability & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI Components & Media
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  pinput: ^5.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - .env.development
    - .env.staging
    - .env.production
    - assets/images/
    - assets/icons/
    - assets/svgs/
